buildscript {
    repositories {
        mavenCentral()
        maven {
            name = 'forge'
            url = 'https://maven.minecraftforge.net/'
        }
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '[6.0,6.2)', changing: true
    }
}

plugins {
    // 高级插件（暂时不需要）
    // id 'com.matthewprenger.cursegradle' version '1.4.0'
    // id 'se.bjurr.gitchangelog.git-changelog-gradle-plugin' version '1.71.4'
    // id 'org.ajoberstar.grgit' version '4.1.1'
    // id 'com.github.ben-manes.versions' version '0.39.0'
}

repositories {
    mavenLocal()
}
apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'idea'
apply plugin: 'maven-publish'
apply from: 'https://raw.githubusercontent.com/SizableShrimp/Forge-Class-Remapper/main/classremapper.gradle'

group = 'cpw.mods'
archivesBaseName = 'inventorysorter'
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

// 动态版本号（依赖 grgit），从项目属性读取或使用默认值（看不懂）
// version = grgit.describe(longDescr: true).split('-').with { "${it[0]}.${it[1]}" }
version = project.findProperty('modVersion') ?: '3.2.0'

minecraft {
    mappings channel: "official", version: MC_VERSION
    runs {
        client {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
            property 'forge.logging.console.level', 'info'
            property 'forge.logging.noansi', 'false'
            ideaModule "${project.name}.main"
        }

        server {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
            property 'forge.logging.console.level', 'info'
            property 'forge.logging.noansi', 'false'
            ideaModule "${project.name}.main"
        }

        data {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'SCAN'
            property 'forge.logging.console.level', 'debug'
            property 'forge.logging.noansi', 'false'
            ideaModule "${project.name}.main"
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${MC_VERSION}-${FORGE_VERSION}"
}

